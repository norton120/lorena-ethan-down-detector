<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lorena & Ethan Status</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Full-width banner outside container -->
    <div class="banner-container">
        <img src="l_e_banner.png" alt="Lorena & Ethan Banner" class="banner-image">
    </div>

    <div class="container">
        <main>
            <!-- Overall Status Banner -->
            <section class="status-banner" id="status-banner">
                <div class="status-content">
                    <div class="status-text">
                        <h2 id="status-title">All Systems Operational</h2>
                        <p id="status-description">All relationship components are functioning normally.</p>
                    </div>
                    <div class="status-icon" id="status-icon"></div>
                </div>
            </section>

            <!-- Components Status -->
            <section class="components-section">
                <div class="components-list" id="components-list">
                    <!-- Components will be dynamically loaded here -->
                </div>
            </section>

            <!-- Incidents Section -->
            <section class="incidents-section">
                <div class="incidents-toggle" id="incidents-toggle" onclick="toggleIncidents()">
                    <span class="incidents-toggle-text">Incident History</span>
                    <span class="incidents-toggle-icon">▼</span>
                </div>
                <div class="incidents-content" id="incidents-content" style="display: none;">
                    <div class="incidents-list" id="incidents-list">
                        <!-- Incidents will be dynamically loaded here -->
                    </div>
                    <div class="no-incidents" id="no-incidents" style="display: none;">
                        <p>No recent incidents to report.</p>
                    </div>
                </div>
            </section>

            <!-- Past Incidents Summary -->
            <section class="history-section">
                <h3>Uptime History</h3>
                <p class="history-note">90-day uptime history coming soon...</p>
            </section>
        </main>

        <footer>
            <p>Last updated: <span id="last-updated"></span></p>
            <p class="footer-note">Powered by love, caffeine, and YAML</p>
        </footer>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/js-yaml@4.1.0/dist/js-yaml.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
